# ============================================================================
# .tmux.conf - Tmux 终端复用器配置文件
# ============================================================================
# 说明: Tmux 是一个终端复用器，本文件配置键位绑定、窗口编号、插件等
# 用途: 定义 Tmux 行为、256 色终端、插件等
# 适用: macOS、Linux
# 加载时机: Tmux 启动时自动加载
# 插件: vim-tmux-navigator, tmux-resurrect, tmux-continuum
# ============================================================================

set -g default-terminal "screen-256color"  # 设置默认终端为 256 色
set -g history-limit 50000                 # 设置历史记录限制为 50000 条

# ========== 鼠标配置 ==========
set -g mouse on

# ========== 窗口编号 ==========
set -g base-index 1              # 窗口编号从 1 开始（默认为 0）
set -g pane-base-index 1         # 窗格编号从 1 开始（默认为 0）
set -g renumber-windows on       # 关闭窗口后自动重新编号，保持连续

# ========== 前缀键配置 ==========
# prefix 是 Tmux 的组合键前缀，用于触发各种快捷键
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ========== 窗格分割 ==========
# 横向分割窗格
unbind %
bind | split-window -h

# 纵向分割窗格
unbind '"'
bind - split-window -v

# ========== 配置文件刷新 ==========
unbind r
bind r source-file ~/.tmux.conf

# ========== 窗格切换 ==========
# 使用 hjkl 选择窗格
bind h select-pane -L   # 左侧窗格
bind j select-pane -D   # 下方窗格
bind k select-pane -U   # 上方窗格
bind l select-pane -R   # 右侧窗格

# ========== 窗格调整 ==========
# 使用方向键调整窗格大小
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# 最大化/还原窗格
bind -r m resize-pane -Z

# ========== Tmux 插件配置 ==========
# 插件管理器
set -g @plugin 'tmux-plugins/tpm'

# 其他插件
set -g @plugin 'christoomey/vim-tmux-navigator'   # Vim/Neovim 与 Tmux 无缝导航
set -g @plugin 'tmux-plugins/tmux-resurrect'    # 持久化 Tmux 会话（重启后恢复）
set -g @plugin 'tmux-plugins/tmux-continuum'    # 自动保存会话（每 15 分钟一次）

# ========== Tmux-resurrect 配置 ==========
set -g @resurrect-capture-pane-contents 'on'      # 保存窗格滚动缓冲区内容

# ========== Tmux-continuum 配置 ==========
set -g @continuum-restore 'on'                    # 启动时自动恢复上次会话

# 初始化 Tmux 插件管理器（此行须放在配置文件末尾）
run '~/.tmux/plugins/tpm/tpm'
