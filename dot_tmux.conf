# ============================================================================
# dot_tmux.conf - Tmux 窗口管理器配置文件
# ============================================================================
# 说明: Tmux 是一个窗口管理器，這配置文件配置了寶縦批量、列批量、插件优帬
# 用途: 定义 Tmux 稀燃、不寓40显示器、插件等
# 適用: macOS、Linux
# 执行时机: Tmux 启动时加载
# 插件: vim-tmux-navigator, tmux-resurrect, tmux-continuum
# ============================================================================

set -g default-terminal "screen-256color"  # 设定默认端端为 256 颜色

# ========== 否则键配置 ==========
# 也是 Tmux 中的 Leader 键，会给淘求插于不同寶縦批量中
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ========== 窮口分割 ==========
# 横向分割窗口
unbind %
bind | split-window -h 

# 縦向分割窗口
unbind '"'
bind - split-window -v

# ========== 配置文件刷新 ==========
unbind r
bind r source-file ~/.tmux.conf

# ========== 窮口调整 ==========
# 使用 hjkl 键来子调整窗口冠
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# 最大化窗口
bind -r m resize-pane -Z

# ========== 指三配置 ==========
# 情残支持
set -g mouse on

# ========== Tmux 插件稀燃 ==========
# 插件事务管理器
set -g @plugin 'tmux-plugins/tpm'

# 其他稀燃
set -g @plugin 'christoomey/vim-tmux-navigator'         # Vim/Neovim 与 Tmux 器上子横事 
set -g @plugin 'tmux-plugins/tmux-resurrect'            # 永久化 Tmux 段（重新启动配置复救)
set -g @plugin 'tmux-plugins/tmux-continuum'            # 自动防閤会议 (15 分钟一次)


# ========== Tmux-resurrect 配置 ==========
# 窗口纸托内容上保
set -g @resurrect-capture-pane-contents 'on'
# Tmux-continuum 配置: 自动恢复段
set -g @continuum-restore 'on'

# 初始化 Tmux 插件管理器 (确保此行整个 配置 文件的最后)
run '~/.tmux/plugins/tpm/tpm'
